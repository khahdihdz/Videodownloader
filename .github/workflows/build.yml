name: Build APK
on: [push,pull_request,workflow_dispatch]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - run: ./gradlew test
      - run: ./gradlew lint
      - run: ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/VideoDownloader-v1.0.${{ github.run_number }}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-debug
          path: release/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" release/*.apk             --target "${{ github.sha }}"             --title "Video Downloader $TAG"             --generate-notes
